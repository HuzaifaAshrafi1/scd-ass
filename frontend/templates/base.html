<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}WeChat Cloned{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/messages.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/connection.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/messaging.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive-fixes.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-stack" role="region" aria-label="Notifications" aria-live="polite">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }} notification-card" role="status">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    {% block scripts %}
<script src="{{ url_for('static', filename='js/utils/dom.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils/toast.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils/storage.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils/modal.js') }}"></script>
{% endblock %}
</body>
</html>
